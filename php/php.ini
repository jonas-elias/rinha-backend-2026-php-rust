; Minimal php.ini tuned for the Swoole+rinha_rs runtime.
memory_limit = 64M
expose_php = Off
date.timezone = UTC

; Bytecode cache + JIT (CLI).
opcache.enable_cli = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4096
opcache.validate_timestamps = 0
opcache.enable_file_override = 0
opcache.jit = tracing
opcache.jit_buffer_size = 32M

; Disable noisy / costly extensions.
short_open_tag = Off
log_errors = On
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Extensions are enabled via /usr/local/etc/php/conf.d/*.ini in the runtime image:
;   - swoole.so   (installed via pecl)
;   - rinha_rs.so (built from rust-ext/)
