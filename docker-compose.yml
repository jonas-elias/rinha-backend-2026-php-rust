services:
  api1: &api
    image: rinha-2026-php-rust:dev
    build:
      context: .
      platforms:
        - linux/amd64
    environment:
      - SOCK=/run/sock/api1.sock
      - INDEX_PATH=/app/data/index.bin
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined

  api2:
    <<: *api
    build: !reset null
    environment:
      - SOCK=/run/sock/api2.sock
      - INDEX_PATH=/app/data/index.bin

  lb:
    image: haproxy:2.9-alpine
    restart: always
    depends_on:
      - api1
      - api2
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sock:/run/sock
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "20M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
